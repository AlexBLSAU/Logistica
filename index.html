<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Herramientas de logística</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1a1f36;--muted:#6b7285;--line:#dde2ee;--navy:#1e2761;--gold:#c9972b;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--bg:#12151f;--card:#1b2030;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3350;--navy:#a9b6ff;--gold:#e0b04a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:520px}h1{margin:0 0 4px;font-size:24px;color:var(--navy)}p{margin:0 0 22px;color:var(--muted);font-size:14px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:var(--ink)}
a.card b{display:block;font-size:17px;color:var(--navy);margin-bottom:3px}a.card span{font-size:13.5px;color:var(--muted)}a.card:hover{border-color:var(--navy)}
</style></head><body><main>
<h1>Herramientas de logística</h1><p>Azuqueca de Henares</p>
<a class="card" href="devoluciones/"><b>Gestión de devoluciones</b><span>Packing lists, comprobación, ubicación y cambios de ubicación de embalaje.</span></a>
<a class="card" href="calendario/"><b>Calendario 2027</b><span>Festivos de Azuqueca y planificación de vacaciones.</span></a>
</main></body></html>
